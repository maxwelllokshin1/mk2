reactive_node:
  ros__parameters:
    # NOTE: bubble_radius, max_lidar_range, speed_max, fov_deg,
    # recovery_clear_dist, lap_leave_dist and lap_return_dist are no longer
    # fixed absolutes — they're the REFERENCE values for a track whose
    # corridors are reference_corridor_m wide (see the "dynamic track-scale
    # adaptation" block below). Tune them as if for a medium-size track; a
    # smaller/tighter track shrinks all of them together at runtime, a
    # bigger/more open one grows them, both within min/max_track_scale.
    bubble_radius: 0.3 # safety zone drawn around closest obstacle lidar sees, car treats as blocked off

    preprocess_conv_size: 3 # fixed the code typo that made this a no-op (was "preporcess_conv_size") — now it actually sets the lidar smoothing window size

    max_lidar_range: 3.5 # how far i allow the car to "see"

    speed_max: 15.0

    steering_gain: 0.38 # how hard the car turns toward target (up -> sharper turn | down -> slower turn)

    alpha_straight: 0.6 # dynamic on straights (up -> stable, ignore wobble | down -> twitchier)
    alpha_curve: 0.60 # dynamic on curves (up -> smoother but slower on turns | down -> reacts instantly)

    fov_deg: 70.0
    gap_aim_aggressiveness: 0.5

    straight_min_forward_frac: 0.75
    straight_max_angle_deg: 6.0
    straight_ema_alpha: 0.2

    # lap tracking — first odom pose is the start/finish line
    lap_leave_dist: 3.0
    lap_return_dist: 1.5
    lap_min_time: 5.0

    # dashboard lidar view / predicted path
    wheelbase: 0.25
    lidar_view_every_n: 10

    recovery_straight_time: 0.8
    recovery_clear_dist: 1.0
    recovery_max_time: 6.0

    enable_dynamic_scaling: true
    lidar_hw_range_m: 10.0        # your lidar's real max reliable range (Hokuyo UST-10LX ~10m); only clips the measurement, never the driving values
    reference_corridor_m: 2.0     # corridor width (m) the values above were tuned for — measure your usual test track
    min_track_scale: 0.4          # floor: how much a tiny track can shrink everything
    max_track_scale: 1.8          # ceiling: how much a huge track can grow everything — lower this before a real (non-sim) speed_max test, see mcu_bridge's own hard speed clamp too
    track_scale_ema_alpha: 0.05   # smoothing on the estimate — higher adapts faster but jitters more