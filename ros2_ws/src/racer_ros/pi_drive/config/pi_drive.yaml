# pi_drive parameters. All numbers that are floats MUST have a decimal point (1500.0, not 1500).
#
# Tune in this order, with the wheels OFF THE GROUND:
#   1. pins            2. steering direction + end stops      3. ESC neutral / arming
#   4. rc_forward / rc_reverse        5. Joy-Con button names (ros2 run pi_drive joycon_probe)

gpio_driver:
  ros__parameters:
    # ---- PINS: BCM GPIO numbers (not header pin numbers). -1 = not connected.
    # Both -1 -> DRY RUN (nothing moves). Steering = GPIO12, throttle = GPIO13 (hardware PWM). Set -1 to disable either.
    # GPIO18/19/21 are taken by the I2S speaker amps (dtoverlay=hifiberry-dac).
    steer_gpio: 12              # header pin 32
    throttle_gpio: 13           # header pin 33 = hardware PWM channel 1 (needs dtoverlay=pwm-2chan,pin=12,func=4,pin2=13,func2=4)
    gpiochip: 0
    # Steering pulses: "auto" = hardware PWM (steady) if /sys/class/pwm/pwmchip2 is there, else software (jitters).
    # Needs dtoverlay=pwm-2chan in config.txt (pi_setup.sh adds it). Pi 5: chip 0 (older kernels: 2), channel 0 = GPIO12, 1 = GPIO13.
    pwm_backend: auto
    pwm_chip: 0
    pwm_channel: 0

    command_timeout_s: 0.5      # no /drive_cmd for this long -> steering centered, throttle neutral
    arm_time_s: 3.0             # ESC held at neutral this long after start
    throttle_slew_per_s: 0.3    # how fast throttle may ramp up (1.0 = full in 1/value s). 0.3 = 1 s to reach 0.3 throttle
    reverse_neutral_s: 0.25     # forward <-> reverse waits this long at neutral

    # ---- steering servo (all PLACEHOLDERS: measure your servo, start with small ranges)
    steer_center_us: 1500.0
    steer_range_us: 200.0       # us from center at full lock
    steer_sign: 1.0             # flip to -1.0 if left turns right
    steer_min_us: 1300.0        # hard clamps, set just inside the mechanical end stops
    steer_max_us: 1700.0
    # Recenter overshoot (loose linkage): returning to center after a turn, go slightly past center to the
    # other side first, hold for recenter_overshoot_s, then settle on center. Bigger turn = bigger kick,
    # up to the per-side maximum below. LEFT / RIGHT = the way the wheels turned before returning.
    # Right side stops short -> raise the right value; set a side to 0.0 to turn its kick off.
    recenter_overshoot_left_us: 40.0
    recenter_overshoot_right_us: 80.0
    recenter_overshoot_s: 0.15
    recenter_min_deflection_us: 50.0   # turns smaller than this (from center) do not kick

    # ---- ESC (PLACEHOLDERS)
    throttle_neutral_us: 1500.0
    throttle_deadband_us: 25.0  # raise if small throttle does nothing
    throttle_fwd_max_us: 1700.0
    throttle_rev_min_us: 1300.0

    # ---- dead-reckoned odom for follow_the_gap's stuck detection (NOT measured)
    odom_speed_at_full_throttle: 2.0
    odom_max_steer_rad: 0.52
    wheelbase: 0.25

joycon_teleop:
  ros__parameters:
    # ---- driving feel (throttle is -1..1 of the ESC range above)
    rc_forward: 0.30            # throttle while A is held
    rc_reverse: 0.25            # throttle while B is held
    steer_deadzone: 0.12
    steer_sign: -1.0            # flip to 1.0 if the stick steers backwards
    # Speed-sensitive steering: slow stick movement = slow, gradual turn-in; a hard flick = full lock almost at once.
    # rate (full lock per s) = steer_rate_min + steer_rate_gain * v * (1 + v), v = how fast the stick moves.
    steer_rate_min: 0.25        # lower = lazier on very slow moves (also how fast the wheels settle once the stick stops)
    steer_rate_gain: 0.8        # lower = softer everywhere, higher = follows the stick more eagerly. 0.0 = off
    steer_vel_hold_s: 0.25      # a flick keeps its fast rate this long so the wheels finish the move

    # ---- autonomy (hold R). Steering AND speed follow reactive_node; throttle is its speed
    # scaled so that auto_speed_ref_mps -> auto_max_throttle. auto_max_throttle is your speed
    # ceiling: raise it step by step as the car does well. Keep auto_speed_ref_mps equal to
    # follow_the_gap gap_params speed_max (0.0 = ignore its speed, use fixed auto_throttle).
    auto_speed_ref_mps: 15.0
    auto_max_throttle: 0.25
    auto_min_throttle: 0.12
    auto_throttle: 0.25
    auto_reverse_throttle: 0.25
    auto_max_steer_rad: 0.52    # = reactive_node max_steering (30 deg)
    auto_timeout_s: 0.5

    # ---- which Joy-Con / evdev names (verify with joycon_probe)
    steer_side: left
    excite_button: BTN_DPAD_UP  # press = EXCITED face + voice line (same Joy-Con as the buttons below). '' = off
    steer_axis: ABS_Y           # stick left/right (Joy-Con held sideways)
    throttle_axis: ''           # '' = drive with the buttons below (D-pad down = forward, left = reverse). ABS_X = stick drives instead
    throttle_deadzone: 0.15     # stick must pass this before the motor gets any throttle
    throttle_sign: 1.0          # flip to -1.0 if pushing up drives backwards
    # Stick drive: speed follows how far you push, up to rc_forward / rc_reverse. The driver ramps it in
    # slowly (throttle_slew_per_s under gpio_driver); letting go stops at once.
    # Buttons below are used only when throttle_axis is '':
    button_side: left
    a_button: BTN_DPAD_DOWN  # forward while held
    b_button: BTN_DPAD_LEFT  # reverse while held
    autonomy_button: BTN_TR2 # hold it autonomy_toggle_hold_s to switch RC <-> AUTONOMOUS (it is no longer a deadman switch)
    autonomy_toggle_hold_s: 3.0

# =====================================================================================
# OLED eyes (128x64 I2C, SSD1306). The picture comes from the current expression:
# config/expressions/{blinking,static}/<name>/eyes/  (base / iris / overlay / blink, see expressions.py)
# =====================================================================================
oled_display:
  ros__parameters:
    start_expression: normal
    blink_every_s: 10.0         # blinking expressions (normal, excited, sarcastic) blink with normal's blink.gif this often. 0 = never
    iris_size: [44, 44]         # iris.png is resized to this
    move_limits: [30, 98, 16, 48]   # x_min, x_max, y_min, y_max the iris CENTER may reach
    lid_move_limits: [20, 108, 10, 60]   # angry / bored: wider + lower, but only where the eyelid leaves the iris visible
    lid_overlap_px: 20          # iris pixels allowed to touch the lid
    mirror_screen: 2            # which screen shows the eyelid mirrored (1 or 2); swap if the lids slant the wrong way
    wander_min_s: 1.0           # bored: the iris looks somewhere new every 1-3 s
    wander_max_s: 3.0
    variant_min_s: 1.5          # excited: flips between its star and ^-^ eyes every 1.5-4 s
    variant_max_s: 4.0
    render_hz: 15.0
    threshold: 160              # 1-bit cutoff. 160 keeps the blue iris ring dark (128 made it vanish into the white)
    dither: false
    track_person: true          # iris follows /person (expressions that track)
    track_invert_x: true        # flip if the eyes look the wrong way
    track_invert_y: false
    track_smooth: 0.35          # 1.0 = snap, smaller = glide
    lost_timeout_s: 2.0         # iris returns to center this long after the person leaves
    i2c_bus: 1
    i2c_address: 60             # 0x3C
    second_i2c_address: 61      # 0x3D, second screen showing the same frame (0 = only one screen)
    second_i2c_bus: -1          # -1 = same bus as i2c_bus; set e.g. 3 if the second screen is on its own bus
    driver: ssd1306             # sh1106 if the picture is shifted / has a noisy column
    rotate: 0
    preview_path: ''            # e.g. /tmp/oled.png writes what the screen shows (no screen needed)

# =====================================================================================
# Expressions + voice: expression_node picks a random face and speaks that face's .mp3 lines
# (config/expressions/*/<name>/voice/). MAX98357 I2S amps. Rules: pi_drive/expressions.py
#   parked:   normal, surprised, angry, sarcastic, excited, sleepy, bored     driving:  normal, angry, sarcastic
#   surprised: about to hit a wall (hazard)    dizzy: collision (hazard)
#   excited:  lap completed, stopped after a long drive, or the excite button (joycon_teleop excite_button)
# =====================================================================================
expression:
  ros__parameters:
    volume: 1.0                 # 100 % (max)
    audio_device: 'plughw:CARD=sndrpihifiberry'   # `aplay -l` shows the card name; 'default' = system default
    drive_throttle_min: 0.05    # |throttle| above this = driving
    drive_hold_s: 3.0           # still "driving" this long after the throttle drops
    person_hold_s: 3.0
    expr_hold_min_s: 8.0        # a face stays 8-25 s, then a random new one
    expr_hold_max_s: 25.0
    say_gap_drive_min_s: 6.0    # pause between voice lines while driving
    say_gap_drive_max_s: 18.0
    say_gap_person_min_s: 8.0   # parked with a person in view: talks more often
    say_gap_person_max_s: 20.0
    say_gap_alone_min_s: 25.0   # parked, nobody around
    say_gap_alone_max_s: 60.0
    greet_min_s: 1.0            # someone shows up while parked -> first line after 1-3 s
    greet_max_s: 3.0
    excited_min_s: 8.0          # excited stays 8-12 s
    excited_max_s: 12.0
    excited_after_drive_s: 60.0 # stopping after driving this long = excited
    surprised_min_s: 3.0        # about to hit a wall: surprised stays 3-5 s
    surprised_max_s: 5.0
    dizzy_min_s: 5.0            # collision: dizzy stays 5-8 s
    dizzy_max_s: 8.0
    force_cooldown_s: 3.0       # the same trigger is ignored again this soon
    close_s: 1.5                # angry / bored play their eyelid backwards this long before the face ends

# =====================================================================================
# Hazards from the LiDAR, only while driving forward: surprise = about to hit, collision = hit  (dizzy face)
# Tune with:  ros2 topic echo /front_range
# =====================================================================================
hazard:
  ros__parameters:
    cone_deg: 20.0              # straight ahead +- this many degrees
    surprise_m: 0.9             # closer than this AND closing in fast = SURPRISED
    closing_mps: 0.5            # "fast" = the gap shrinks at least this many m/s
    collision_m: 0.2            # closer than this = DIZZY (depends how far the lidar sits behind the bumper)
    surprise_cooldown_s: 8.0
    collision_cooldown_s: 10.0

# =====================================================================================
# Lap detector: LiDAR picture of the start line -> /lap_completed (excited face + voice)
# Park on the start line, then drive. Watch the tuning number:  ros2 topic echo /lap_debug
# =====================================================================================
lap_detector:
  ros__parameters:
    match_m: 0.6                # closer than this to the start-line picture = back at the start (raise if laps are missed)
    away_m: 1.2                 # must have been farther than this since the last lap (raise if it fires early)
    min_lap_s: 8.0              # never two laps closer than this (set a bit under your fastest lap)
    max_range_m: 6.0
    rearm_idle_s: 20.0          # parked this long -> the next start is a new start line, count back to 0

# =====================================================================================
# Person detection: camera -> YOLOv8 ONNX -> ONE person (/person, x/y 0..1)
# =====================================================================================
person_detector:
  ros__parameters:
    source: tcp://127.0.0.1:8888   # ribbon camera: the host streams it (scripts/pi/camera-stream.service)
                                   # USB webcam instead: /dev/video0 (and add it to devices: in compose)
                                   # testing: a photo/video file path
    width: 320                  # only used for USB webcams; for the stream see camera-stream.service
    height: 240
    fourcc: MJPG
    model_path: yolov8n.onnx    # in this config folder. Export from yolov8n.pt (see README)
    input_size: 320             # MUST equal the imgsz used for the ONNX export
    conf_threshold: 0.5
    nms_threshold: 0.45
    select: largest             # largest = closest person | confident
    pause_while_driving: true   # no person detection while the car drives; it works again once the car is still
    drive_throttle_min: 0.05    # |throttle| above this = driving
    drive_hold_s: 1.0           # still "driving" this long after the throttle drops
    detect_hz: 2.0              # keep low on a Pi 3
    cv_threads: 2
    preview_hz: 4.0             # frames/s sent to the dashboard Camera tab (0.0 = off). Only encoded while the dashboard runs
    preview_quality: 55         # JPEG quality of the preview
    debug_image_path: ''        # e.g. /tmp/person.jpg shows the camera frame with the box
