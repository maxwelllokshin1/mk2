; PlatformIO project file: tells the build system WHAT chip you're compiling
; for and HOW. One [env:...] section per board you want to build for.
;
; Commands (run in this folder):
;   pio run                                   compile
;   pio run -t upload --upload-port /dev/ttyACM0   compile + flash
;   pio device monitor                        raw serial monitor (see README: you
;                                             can't print debug text on this port)

[env:uno]
platform = atmelavr         ; the chip family's toolchain (AVR = Uno/Nano/Mega)
board = uno                 ; CHANGE THIS to match your board: nanoatmega328, megaatmega2560, ...
framework = arduino         ; gives you setup()/loop(), Serial, millis(), Servo, ...
monitor_speed = 115200      ; must match BAUD in include/config.h
lib_extra_dirs = libs_external   ; where hand-copied third-party libraries go
