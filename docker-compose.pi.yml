# Raspberry Pi 3 (1 GB) — run with:  docker compose -f docker-compose.pi.yml up -d
# Image is built elsewhere and loaded onto the Pi (see scripts/pi/README.md).
services:
  racer:
    image: airacer:pi
    container_name: racer
    network_mode: host          # DDS discovery + LiDAR over ethernet
    restart: unless-stopped
    init: true                  # reap zombie processes
    environment:
      # rpi-lgpio (the RPi.GPIO shim on a Pi 5) can't read the board revision inside the container.
      # Set it in .env from the host:  echo "RPI_LGPIO_REVISION=$(awk '/Revision/{print $3}' /proc/cpuinfo)" >> .env
      RPI_LGPIO_REVISION: "${RPI_LGPIO_REVISION:-c04170}"
    # Starts everything: Joy-Con teleop, GPIO driver, LiDAR, autonomy, dashboard, OLED, person detection.
    # Flags: lidar:=false  autonomy:=false  dashboard:=false  oled:=false  person:=false
    command: ["ros2", "launch", "pi_drive", "pi_drive.launch.py"]
    # Hard ceiling so a runaway node gets OOM-killed inside the container
    # instead of freezing the whole Pi. memswap = mem + 512 MB of swap.
    mem_limit: 2g               # Pi 3 (1 GB): use 640m / memswap 1152m
    memswap_limit: 3g
    cpus: 3.0                   # leave one core for the OS / SSH
    pids_limit: 256
    # Only the devices that are needed — no privileged, no /sys, no /dev mount.
    devices:
      # Pi 5: header GPIO is the RP1 chip. Check `gpiodetect` for pinctrl-rp1 (gpiochip0 on current kernels,
      # older ones used gpiochip4). Pi 3/4: gpiochip0.
      - /dev/gpiochip0:/dev/gpiochip0
      # Pi 3/4 only (does not exist on a Pi 5, docker refuses to start if it is missing):
      # - /dev/gpiomem:/dev/gpiomem
      # Must EXIST when the container starts (enable I2C) or docker refuses to start it.
      - /dev/i2c-1:/dev/i2c-1       # OLED
      # USB webcam only (the ribbon camera is streamed in over tcp, no device needed):
      # - /dev/video0:/dev/video0
      # - /dev/ttyACM0:/dev/ttyACM0   # VESC / Arduino, uncomment if used
    group_add:
      # numeric host gids:  getent group gpio dialout input i2c
      - "${GPIO_GID:-994}"
      - "${DIALOUT_GID:-20}"
      - "${INPUT_GID:-105}"     # Joy-Cons show up as /dev/input/event* (group "input")
      - "${I2C_GID:-995}"       # OLED: group "i2c"
    # Joy-Cons connect AFTER the container starts, so mount the whole directory
    # (new event nodes appear live) and allow input devices (char major 13).
    device_cgroup_rules:
      - "c 13:* rmw"
    volumes:
      - /dev/input:/dev/input
      # hardware PWM for the steering servo is driven through sysfs (group gpio can write the pwm files)
      - /sys:/sys
      # edit pins / tuning / eye images / the YOLO model on the Pi without rebuilding the image:
      - ./ros2_ws/src/racer_ros/pi_drive/config:/ws/install/pi_drive/share/pi_drive/config:ro
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
